name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 环境诊断
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: 安装 Tauri CLI
        run: npm install

      - name: 构建
        run: npm run build -- --verbose

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FTPSync-windows-x64
          path: |
            src-tauri/target/release/FTPSync.exe
            src-tauri/target/release/bundle/nsis/*.exe
